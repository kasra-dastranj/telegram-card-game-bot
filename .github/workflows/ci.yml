name: TelBattle CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    outputs:
      artifact_name:
        value: ${{ jobs.package.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: versions
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          versions = [Path(p).read_text().strip() for p in ('.python-version', '.server-python-version')]
          assert all(re.fullmatch(r'\d+\.\d+(\.\d+)?', v) for v in versions)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps(list(dict.fromkeys(versions))) + '\n')
          PY
  python:
    name: Python (${{ matrix.python }})
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      TELBATTLE_OFFLINE_CI: '1'
      RUN_LIVE_TELEGRAM_TESTS: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          mkdir -p "$RUNNER_TEMP/telbattle-tests"
          echo "TELBATTLE_TEST_DB_ROOT=$RUNNER_TEMP/telbattle-tests" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/telbattle-tests" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements.txt 'pytest>=8.4,<9'
      - run: python -m pytest -q --basetemp "$TELBATTLE_TEST_DB_ROOT/pytest" --junitxml "$RUNNER_TEMP/results.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-${{ matrix.python }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results.xml
          retention-days: 14
  frontend:
    name: Frontend and admin JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/game/package-lock.json
      - run: npm ci
        working-directory: frontend/game
      - run: npm run build
        working-directory: frontend/game
      - run: python scripts/check_admin_javascript.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: frontend/game/dist
          if-no-files-found: error
          retention-days: 14
  package:
    name: Verified release package
    needs: [python, frontend]
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.name.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: frontend/game/dist
      - run: python deployment/actions/package_release.py build --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - id: name
        run: echo "artifact_name=release-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14
      - run: |
          printf 'Tested source: `%s`\n\nRelease artifact: `%s`\n\nDatabase policy: no change\n' "$GITHUB_SHA" '${{ steps.name.outputs.artifact_name }}' >> "$GITHUB_STEP_SUMMARY"
  gate:
    name: CI gate
    if: always()
    needs: [versions, python, frontend, package]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          assert all(job['result'] == 'success' for job in json.loads(os.environ['RESULTS']).values())
          PY
